MODEL:
  META_ARCHITECTURE: "HybridRetinaUNet"

INPUT:
  N_DIM: 3
  N_CHANNELS: 1
  N_OBJ_CLASSES: 4
  N_UNIQUE_OBJ_CLASSES: 2
  N_REL_CLASSES: 4
  N_IMG_ATT_CLASSES: 0
  N_ATT_CLASSES: 6


DATASETS:
  TRAIN: ("BHSD", "CQ500", "HemSeg200", "INST2022", "MZ", "PhysioNet")
  VAL: ("BHSD", "CQ500", "HemSeg200", "INST2022", "MZ", "PhysioNet")
  TEST: ("BHSD", "CQ500", "HemSeg200", "INST2022", "MZ", "PhysioNet")
  EVALUATION_PARAMETERS: "default_3d"

TEST:
  IMS_PER_BATCH: 1
  DO_PRETRAIN_VAL: False
  TRACK_VAL_LOSS: True
  VAL_PERIOD: 16000
  SAVE_BOXLISTS: False
  SAVE_SEGMENTATIONS: False

  COCO:
    PER_CATEGORY_METRICS: True

  RELATION:
    IOU_THRESHOLD: 0.3  # IoU threshold for metrics
    RECALL_AT_K: [ 2, 5, 8, 10 ]
    COMPUTE_RELATION_UPPER_BOUND: True
    UPPER_BOUND_ALLOW_RECLASSIFICATION: False

OUTPUT_DIR: "{output}"
